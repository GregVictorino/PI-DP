<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca — Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .view { display: none; }
    .view.active { display: block; }

    .login-links {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
    }

    .link-btn {
      background: none;
      border: none;
      color: #2563eb;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }

    .link-btn:hover { color: #1d4ed8; }

    .back-link {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin-bottom: 20px;
    }

    .back-link:hover { color: #1e293b; }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #94a3b8;
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .senha-wrapper {
      position: relative;
    }

    .senha-wrapper input {
      padding-right: 42px;
    }

    .toggle-senha {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      padding: 0;
      display: flex;
    }

    .toggle-senha:hover { color: #475569; }
  </style>
</head>
<body class="login-page">

  <div class="login-card">

    <!-- LOGO sempre visível -->
    <div class="login-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    </div>

    <!-- ===== VIEW: LOGIN ===== -->
    <div id="view-login" class="view active">
      <h1>Bem-vindo</h1>
      <p class="login-subtitle">Sistema de Locação de Livros</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="seu@email.com" required />
        </div>
        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <div class="senha-wrapper">
            <input type="password" id="loginSenha" placeholder="••••••••" required />
            <button type="button" class="toggle-senha" onclick="toggleSenha('loginSenha', this)">
              <svg id="icon-eye-login" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div id="loginError" class="alert alert-error" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Entrar</button>

        <div class="login-links">
          <button type="button" class="link-btn" onclick="showView('view-esqueci')">Esqueci minha senha</button>
          <button type="button" class="link-btn" onclick="showView('view-cadastro')">Cadastrar admin</button>
        </div>
      </form>
    </div>

    <!-- ===== VIEW: ESQUECI A SENHA ===== -->
    <div id="view-esqueci" class="view">
      <button class="back-link" onclick="showView('view-login')">
        ← Voltar ao login
      </button>
      <h1>Redefinir Senha</h1>
      <p class="login-subtitle">Informe seu email e a nova senha</p>

      <form id="resetForm">
        <div class="form-group">
          <label for="resetEmail">Email cadastrado</label>
          <input type="email" id="resetEmail" placeholder="seu@email.com" required />
        </div>
        <div class="form-group">
          <label for="resetNovaSenha">Nova senha</label>
          <div class="senha-wrapper">
            <input type="password" id="resetNovaSenha" placeholder="Nova senha" required />
            <button type="button" class="toggle-senha" onclick="toggleSenha('resetNovaSenha', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="resetConfirm">Confirmar nova senha</label>
          <div class="senha-wrapper">
            <input type="password" id="resetConfirm" placeholder="Confirme a nova senha" required />
            <button type="button" class="toggle-senha" onclick="toggleSenha('resetConfirm', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div id="resetMsg" class="alert" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-full" id="resetBtn">Redefinir Senha</button>
      </form>
    </div>

    <!-- ===== VIEW: CADASTRO ADMIN ===== -->
    <div id="view-cadastro" class="view">
      <button class="back-link" onclick="showView('view-login')">
        ← Voltar ao login
      </button>
      <h1>Novo Administrador</h1>
      <p class="login-subtitle">Crie uma conta com acesso total ao sistema</p>

      <form id="cadastroForm">
        <div class="form-group">
          <label for="cadNome">Nome completo</label>
          <input type="text" id="cadNome" placeholder="Seu nome" required />
        </div>
        <div class="form-group">
          <label for="cadEmail">Email</label>
          <input type="email" id="cadEmail" placeholder="seu@email.com" required />
        </div>
        <div class="form-group">
          <label for="cadSenha">Senha</label>
          <div class="senha-wrapper">
            <input type="password" id="cadSenha" placeholder="Mín. 8 caracteres + 1 especial" required oninput="atualizarForca(this.value)" />
            <button type="button" class="toggle-senha" onclick="toggleSenha('cadSenha', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel" style="color:#94a3b8"></div>
        </div>
        <div class="form-group">
          <label for="cadConfirm">Confirmar senha</label>
          <div class="senha-wrapper">
            <input type="password" id="cadConfirm" placeholder="Repita a senha" required />
            <button type="button" class="toggle-senha" onclick="toggleSenha('cadConfirm', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="cadTelefone">Telefone <span style="color:#94a3b8">(opcional)</span></label>
          <input type="text" id="cadTelefone" placeholder="(11) 99999-9999" />
        </div>

        <div id="cadastroMsg" class="alert" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-full" id="cadastroBtn">Criar Conta Admin</button>

        <div class="divider">ou</div>
        <button type="button" class="btn btn-secondary btn-full" onclick="showView('view-login')">Já tenho conta</button>
      </form>
    </div>

  </div>

  <script>
    const API = '/api';

    // ========================
    // NAVEGAÇÃO ENTRE VIEWS
    // ========================
    function showView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelectorAll('.alert').forEach(a => a.style.display = 'none');
    }

    // ========================
    // MOSTRAR/OCULTAR SENHA
    // ========================
    function toggleSenha(inputId, btn) {
      const input = document.getElementById(inputId);
      const mostrar = input.type === 'password';
      input.type = mostrar ? 'text' : 'password';
      btn.innerHTML = mostrar
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }

    // ========================
    // LOGIN
    // ========================
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');

      btn.textContent = 'Entrando...';
      btn.disabled = true;
      errorEl.style.display = 'none';

      try {
        const res = await fetch(`${API}/usuarios/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            senha: document.getElementById('loginSenha').value
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.erro || 'Email ou senha inválidos');
        }

        const usuario = await res.json();
        sessionStorage.setItem('usuario', JSON.stringify(usuario));
        window.location.href = 'dashboard.html';

      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.textContent = 'Entrar';
        btn.disabled = false;
      }
    });

    // ========================
    // ESQUECI A SENHA
    // ========================
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('resetBtn');
      const msgEl = document.getElementById('resetMsg');

      const novaSenha = document.getElementById('resetNovaSenha').value;
      const confirm = document.getElementById('resetConfirm').value;

      msgEl.className = 'alert';
      msgEl.style.display = 'none';

      if (novaSenha !== confirm) {
        msgEl.className = 'alert alert-error';
        msgEl.textContent = 'As senhas não coincidem';
        msgEl.style.display = 'block';
        return;
      }

      if (!validarSenha(novaSenha)) {
        msgEl.className = 'alert alert-error';
        msgEl.textContent = 'A senha deve ter no mínimo 8 caracteres e 1 caractere especial (!@#$%...)';
        msgEl.style.display = 'block';
        return;
      }

      btn.textContent = 'Salvando...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/usuarios/resetar-senha`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('resetEmail').value,
            novaSenha
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.erro || 'Email não encontrado');
        }

        msgEl.className = 'alert alert-success';
        msgEl.textContent = 'Senha redefinida com sucesso! Faça o login.';
        msgEl.style.display = 'block';
        document.getElementById('resetForm').reset();

        setTimeout(() => showView('view-login'), 2000);

      } catch (err) {
        msgEl.className = 'alert alert-error';
        msgEl.textContent = err.message;
        msgEl.style.display = 'block';
      } finally {
        btn.textContent = 'Redefinir Senha';
        btn.disabled = false;
      }
    });

    // ========================
    // CADASTRO ADMIN
    // ========================
    document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('cadastroBtn');
      const msgEl = document.getElementById('cadastroMsg');

      const senha = document.getElementById('cadSenha').value;
      const confirm = document.getElementById('cadConfirm').value;

      msgEl.className = 'alert';
      msgEl.style.display = 'none';

      if (senha !== confirm) {
        msgEl.className = 'alert alert-error';
        msgEl.textContent = 'As senhas não coincidem';
        msgEl.style.display = 'block';
        return;
      }

      if (!validarSenha(senha)) {
        msgEl.className = 'alert alert-error';
        msgEl.textContent = 'A senha deve ter no mínimo 8 caracteres e 1 caractere especial (!@#$%...)';
        msgEl.style.display = 'block';
        return;
      }

      btn.textContent = 'Criando conta...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/usuarios`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome: document.getElementById('cadNome').value,
            email: document.getElementById('cadEmail').value,
            senha,
            telefone: document.getElementById('cadTelefone').value,
            role: 'ADMIN'
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.erro || 'Erro ao criar conta');
        }

        msgEl.className = 'alert alert-success';
        msgEl.textContent = 'Conta criada com sucesso! Redirecionando...';
        msgEl.style.display = 'block';
        document.getElementById('cadastroForm').reset();

        setTimeout(() => showView('view-login'), 2000);

      } catch (err) {
        msgEl.className = 'alert alert-error';
        msgEl.textContent = err.message;
        msgEl.style.display = 'block';
      } finally {
        btn.textContent = 'Criar Conta Admin';
        btn.disabled = false;
      }
    });

    // ========================
    // FORÇA DE SENHA
    // ========================
    function atualizarForca(senha) {
      const fill  = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      let score = 0;
      if (senha.length >= 8)             score++;
      if (senha.length >= 12)            score++;
      if (/[A-Z]/.test(senha))           score++;
      if (/[0-9]/.test(senha))           score++;
      if (/[^A-Za-z0-9]/.test(senha))   score++;

      const levels = [
        { pct: '0%',   color: '#e2e8f0', text: '' },
        { pct: '25%',  color: '#ef4444', text: 'Fraca' },
        { pct: '50%',  color: '#f97316', text: 'Regular' },
        { pct: '75%',  color: '#eab308', text: 'Boa' },
        { pct: '90%',  color: '#22c55e', text: 'Forte' },
        { pct: '100%', color: '#16a34a', text: 'Muito forte' },
      ];
      const l = levels[score] || levels[0];
      fill.style.width      = senha.length === 0 ? '0%' : l.pct;
      fill.style.background = l.color;
      label.textContent     = l.text;
      label.style.color     = l.color;
    }

    // ========================
    // HELPERS
    // ========================
    function validarSenha(senha) {
      return senha.length >= 8 && /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(senha);
    }

    function maskPhone(v) {
      const d = v.replace(/\D/g, '').slice(0, 11);
      if (d.length <= 10) return d.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{4})(\d)/, '$1-$2');
      return d.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d)/, '$1-$2');
    }

    document.getElementById('cadTelefone').addEventListener('input', function () {
      this.value = maskPhone(this.value);
    });
  </script>
</body>
</html>
